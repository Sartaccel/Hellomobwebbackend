# ===============================
# = SERVER CONFIG
# ===============================
server.port=8080
server.servlet.context-path=/api

# ===============================
# = APPLICATION
# ===============================
spring.application.name=helloMobileBackend-service

# ===============================
# = MYSQL DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/hello_mobiles_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Benil@45
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# = CONNECTION POOL (Hikari - Default)
# ===============================
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=2000000
spring.datasource.hikari.connection-timeout=30000

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.yourpackage=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# = FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# = JACKSON CONFIG
# ===============================
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
#jwt.secret=hellomobilessecretkeyhellomobilessecretkey
jwt.secret=hellomobilessecretkeyhellomobilessecretkeyhellomobiles
# ===============================
# = GMAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true